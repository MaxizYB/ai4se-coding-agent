services:
  - type: web
    name: harness-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: HARNESS_DEMO_REPO
        value: /app/examples/demo
      - key: PYTHONUNBUFFERED
        value: "1"
    plan: free
