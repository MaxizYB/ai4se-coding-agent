[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
requires-python = ">=3.11"
# Core harness kernel is stdlib-only except for `cryptography`, which backs the
# core CredentialStore (src/harness/credentials.py) imported at module top by
# both production code and the unit test suite. Heavy web deps stay optional so
# the feedback/guardrail/parsing tasks stay hermetic without network.
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
full = ["cryptography>=42", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
dev = ["pytest>=8", "ruff"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
markers = ["live: tests calling a real LLM (deselect with -m 'not live')"]
# I2: treat warnings as errors so latent bugs surface, but ignore third-party
# deprecations we cannot fix upstream. NOTE: starlette's
# StarletteDeprecationWarning is a UserWarning (NOT a DeprecationWarning
# subclass) emitted from fastapi/testclient.py at import time, so it needs its
# own line -- the broad `DeprecationWarning:starlette` filter would miss it.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
