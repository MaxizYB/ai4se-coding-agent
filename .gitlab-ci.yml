image: python:3.11-slim

stages: [test, build]

# python:3.11-slim is Debian-based but does NOT ship `make`; install it so the
# Makefile targets used below (`make test`, `make lint`) are runnable.
unit-test:
  stage: test
  before_script:
    - apt-get update && apt-get install -y make
  script:
    # [full] pulls fastapi/uvicorn/httpx required by tests/integration/test_webui.py
    # at collection time; [dev] is only pytest+ruff (C1).
    - pip install -e ".[full,dev]"
    - make test
  artifacts:
    reports:
      junit: .harness/junit.xml

lint:
  stage: test
  before_script:
    - apt-get update && apt-get install -y make
  script:
    - pip install -e ".[dev]"
    - make lint

build-image:
  stage: build
  image: docker:24
  services: [docker:24-dind]
  script:
    - docker build -t harness:latest .
    - docker run --rm harness key status
  only: [main]
